<style>
        /* Minimalist fade-in animation for the monumental aesthetic */
        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-300 { animation-delay: 0.3s; }
        .delay-500 { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);

<body class="text-on-background antialiased min-h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- 
      Note: Shared Navigation Components (TopNavBar, SideNavBar, Footer) are INTENTIONALLY SUPPRESSED 
      according to the 'Linear/Transactional' exclusion rule for Login screens. 
      The focus must remain solely on the canvas.
    -->
<main class="w-full max-w-md px-margin-mobile md:px-0 flex flex-col items-center relative z-10">
<!-- Monumental Typography Brand Anchor -->
<h1 class="font-display-xl text-display-xl text-on-background uppercase tracking-[0.2em] mb-section-gap fade-in-up md:text-display-xl text-headline-lg-mobile text-center">
            LABURO
        </h1>
<!-- High-Contrast Minimalist Form Container -->
<form action="#" class="w-full flex flex-col gap-stack-lg fade-in-up delay-300" method="POST">
<div class="relative w-full group">
<!-- Label styled as requested in design system (label-sm positioned above) -->
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2 block transition-colors group-focus-within:text-on-background" for="email">
                    Correo Electrónico
                </label>
<!-- Input field: Bottom border only, hairline, no background -->
<input autocomplete="email" class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-on-background focus:ring-0 font-body-lg text-body-lg text-on-background py-4 px-0 rounded-none transition-colors duration-300 placeholder-surface-variant" id="email" name="email" placeholder=" " required="" type="email"/>
</div>
<!-- Action Button: Ghost to Solid minimal interaction -->
<button class="w-full mt-stack-md border border-on-background bg-transparent text-on-background py-6 px-8 flex items-center justify-center gap-4 hover:bg-on-background hover:text-primary-container transition-colors duration-150 cursor-pointer fade-in-up delay-500" type="submit">
<span class="font-label-sm text-label-sm uppercase tracking-[0.2em]">Acceso</span>
<!-- Optional minimal arrow icon to emphasize action -->
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;">
                    arrow_right_alt
                </span>
</button>
</form>
<!-- Optional subtle noise texture to prevent banding in absolute black screens -->
<div class="pointer-events-none fixed inset-0 opacity-[0.02]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
</main>
