<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Oferta Enviada - Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Syne:wght@400;600;700;800&amp;family=Geist:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Custom font declarations to ensure Tailwind picks them up properly if they are not system fonts */
        @font-face { font-family: 'Syne'; src: url('https://fonts.gstatic.com/s/syne/v22/8vIX7OqKnmZ-32hDIFXQZes.woff2') format('woff2'); }
        @font-face { font-family: 'Inter'; src: url('https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfMZhrib2Bg-4.woff2') format('woff2'); }
        @font-face { font-family: 'Geist'; src: url('https://fonts.gstatic.com/s/geist/v1/xkqq3XVr5xSg72Aro_f823kM2hYc.woff2') format('woff2'); }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#000000",
                      "secondary-fixed-dim": "#c6c6c7",
                      "on-error": "#690005",
                      "error": "#ffb4ab",
                      "secondary-fixed": "#e2e2e2",
                      "on-surface": "#e5e2e1",
                      "on-primary": "#303030",
                      "secondary": "#c6c6c7",
                      "tertiary": "#b9c3ff",
                      "surface-container-low": "#1c1b1b",
                      "tertiary-fixed-dim": "#b9c3ff",
                      "on-tertiary-fixed": "#001257",
                      "on-tertiary-container": "#4266ff",
                      "on-background": "#e5e2e1",
                      "error-container": "#93000a",
                      "secondary-container": "#454747",
                      "on-primary-container": "#757575",
                      "surface": "#131313",
                      "on-primary-fixed": "#1b1b1b",
                      "background": "#131313",
                      "on-tertiary-fixed-variant": "#0033c0",
                      "on-secondary": "#2f3131",
                      "on-secondary-container": "#b4b5b5",
                      "primary-fixed": "#e2e2e2",
                      "inverse-on-surface": "#313030",
                      "on-secondary-fixed-variant": "#454747",
                      "surface-bright": "#393939",
                      "on-secondary-fixed": "#1a1c1c",
                      "surface-container-lowest": "#0e0e0e",
                      "on-tertiary": "#00228a",
                      "on-surface-variant": "#cfc4c5",
                      "tertiary-fixed": "#dde1ff",
                      "on-error-container": "#ffdad6",
                      "surface-container-high": "#2a2a2a",
                      "surface-dim": "#131313",
                      "surface-container": "#20201f",
                      "surface-tint": "#c6c6c6",
                      "primary-fixed-dim": "#c6c6c6",
                      "primary-container": "#000000",
                      "primary": "#c6c6c6",
                      "surface-variant": "#353535",
                      "inverse-surface": "#e5e2e1",
                      "on-primary-fixed-variant": "#474747",
                      "surface-container-highest": "#353535",
                      "outline": "#988e90",
                      "outline-variant": "#4c4546",
                      "inverse-primary": "#5e5e5e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-max": "1440px",
                      "stack-sm": "8px",
                      "margin-mobile": "24px",
                      "margin-desktop": "80px",
                      "section-gap": "160px",
                      "gutter": "32px",
                      "stack-md": "24px",
                      "stack-lg": "48px"
              },
              "fontFamily": {
                      "headline-md": ["Syne", "sans-serif"],
                      "body-lg": ["Inter", "sans-serif"],
                      "headline-lg": ["Syne", "sans-serif"],
                      "body-md": ["Inter", "sans-serif"],
                      "label-sm": ["Geist", "sans-serif"],
                      "display-xl": ["Syne", "sans-serif"],
                      "headline-lg-mobile": ["Syne", "sans-serif"]
              },
              "fontSize": {
                      "headline-md": ["32px", { "lineHeight": "120%", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "body-lg": ["18px", { "lineHeight": "160%", "letterSpacing": "0em", "fontWeight": "400" }],
                      "headline-lg": ["64px", { "lineHeight": "110%", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "body-md": ["16px", { "lineHeight": "160%", "letterSpacing": "0em", "fontWeight": "400" }],
                      "label-sm": ["12px", { "lineHeight": "140%", "letterSpacing": "0.1em", "fontWeight": "500" }],
                      "display-xl": ["120px", { "lineHeight": "110%", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                      "headline-lg-mobile": ["40px", { "lineHeight": "110%", "letterSpacing": "-0.02em", "fontWeight": "700" }]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-section-gap font-body-md antialiased overflow-x-hidden">
<!-- Main Content Canvas - Suppressing all Navs as per Transactional/Success intent rule -->
<main class="w-full max-w-container-max mx-auto flex flex-col items-center">
<!-- Status Icon -->
<div class="mb-stack-lg animate-fade-in-up" style="animation-duration: 0.8s; animation-fill-mode: both;">
<span class="material-symbols-outlined text-[64px] md:text-[80px] text-primary" style="font-variation-settings: 'wght' 200, 'FILL' 0;">
                done_all
            </span>
</div>
<!-- Massive Monumental Heading -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-xl md:text-display-xl text-center uppercase text-on-background tracking-tighter mb-section-gap animate-fade-in-up" style="animation-duration: 1s; animation-fill-mode: both; animation-delay: 0.1s;">
            Oferta Enviada
        </h1>
<!-- Architectural Summary Block (Bento-inspired hairline grid) -->
<div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-[1px] bg-outline-variant p-[1px] mb-section-gap animate-fade-in-up" style="animation-duration: 1s; animation-fill-mode: both; animation-delay: 0.2s;">
<!-- Cell: Staff -->
<div class="bg-surface-container-lowest p-stack-lg flex flex-col gap-stack-sm hover:bg-surface-container-low transition-colors duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                    Staff
                </span>
<span class="font-headline-md text-headline-md text-on-background">
                    Elena Rostova
                </span>
</div>
<!-- Cell: Role -->
<div class="bg-surface-container-lowest p-stack-lg flex flex-col gap-stack-sm hover:bg-surface-container-low transition-colors duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                    Role
                </span>
<span class="font-headline-md text-headline-md text-on-background">
                    Lead Curator
                </span>
</div>
<!-- Cell: Event -->
<div class="bg-surface-container-lowest p-stack-lg flex flex-col gap-stack-sm hover:bg-surface-container-low transition-colors duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                    Event
                </span>
<span class="font-headline-md text-headline-md text-on-background">
                    Art Basel '24
                </span>
</div>
</div>
<!-- Primary Action -->
<div class="w-full flex justify-center animate-fade-in-up" style="animation-duration: 1s; animation-fill-mode: both; animation-delay: 0.3s;">
<button class="group relative inline-flex items-center justify-center bg-primary text-on-primary px-12 py-6 border border-transparent hover:bg-transparent hover:text-primary hover:border-primary transition-all duration-150 cursor-pointer">
<span class="absolute left-6 material-symbols-outlined opacity-0 -translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300" style="font-variation-settings: 'wght' 300;">
                    arrow_back
                </span>
<span class="font-label-sm text-label-sm uppercase tracking-widest group-hover:translate-x-4 transition-transform duration-300">
                    Volver Al Roster
                </span>
</button>
</div>
</main>
<style>
        /* Lightweight entry animations for the success screen to emphasize completion */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation-name: fadeInUp;
        }
    </style>
</body></html>
