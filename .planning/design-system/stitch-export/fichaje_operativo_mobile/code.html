<script>
        // Simple micro-interaction script for the check-in button
        document.getElementById('checkInBtn').addEventListener('click', function() {
            const btn = this;
            const innerText = btn.querySelector('span:last-child');
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Simulate action
            btn.classList.remove('pulse-ring');
            btn.classList.add('bg-surface-container-highest', 'text-primary');
            btn.classList.remove('bg-primary', 'text-primary-container');
            
            icon.textContent = 'check_circle';
            innerText.textContent = 'CHECKED IN';
            
            // Update history visually
            setTimeout(() => {
                const historyEntry = document.querySelector('ul li:first-child span:last-child');
                historyEntry.textContent = '08:45';
                historyEntry.classList.add('text-primary');
            }, 500);
        });
    </script>
